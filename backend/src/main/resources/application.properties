# App Name
spring.application.name=CRUD-Operations

# Server Port (Render / Local compatible)
server.port=${PORT:8080}

# =========================
# DATABASE CONFIG (MySQL)
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE CONFIG
# =========================

# Auto update table structure (DEV ONLY)
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console (good for debugging)
spring.jpa.show-sql=true

# Pretty formatted SQL
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect (modern correct one)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# OPTIONAL (performance)
# =========================
spring.jpa.open-in-view=false
